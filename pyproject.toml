[project]
name = "changedet"
version = "0.0.1"
description = "What changed in the room? 3D change detection from two Record3D / phone recordings."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "open3d>=0.18",
    "OpenEXR>=3.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rerun-sdk>=0.20",
    "matplotlib>=3.8",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.56",
]

[project.scripts]
changedet = "changedet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["changedet"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: needs the Record3D recordings in vid1/ and vid2/ (skipped if absent)",
    "models: needs model checkpoints in checkpoints/ (skipped if absent)",
]
